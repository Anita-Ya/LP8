<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>ऑर्डर कन्फर्म हुआ | Neuro Mantra</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Mukta:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #1D3557;
      --accent: #E63946;
      --white: #FFFFFF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Mukta', -apple-system, BlinkMacSystemFont, sans-serif;
      background: rgba(29, 53, 87, 0.72);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--primary);
      -webkit-font-smoothing: antialiased;
    }

    .thankyou-modal-card {
      position: relative;
      background: #FFFFFF;
      border-radius: 26px;
      padding: 34px 22px 28px 22px;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(29, 53, 87, 0.08);
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.9);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .thankyou-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(29, 53, 87, 0.06);
      border: none;
      font-size: 20px;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 1;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .thankyou-close-btn:hover {
      background: rgba(230, 57, 70, 0.12);
      color: var(--accent);
      transform: scale(1.08);
    }

    .thankyou-icon-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(29, 53, 87, 0.04);
      border: 2.5px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: var(--primary);
    }

    .thankyou-icon-circle svg {
      width: 32px;
      height: 32px;
      stroke: var(--primary);
      stroke-width: 3;
    }

    .thankyou-badge {
      display: inline-block;
      background: rgba(29, 53, 87, 0.07);
      color: var(--primary);
      border: 1.5px solid rgba(29, 53, 87, 0.15);
      font-size: 14px;
      font-weight: 800;
      padding: 5px 20px;
      border-radius: 999px;
      letter-spacing: 0.3px;
      margin-bottom: 14px;
    }

    .thankyou-title {
      font-size: 23px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .thankyou-title .customer-name {
      color: var(--accent);
    }

    .thankyou-desc {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .thankyou-desc strong {
      color: var(--primary);
      font-weight: 800;
    }

    .thankyou-details-box {
      background: #F9FBFC;
      border: 1.5px solid rgba(29, 53, 87, 0.12);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .thankyou-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    .thankyou-detail-row:not(:last-child) {
      border-bottom: 1px dashed rgba(29, 53, 87, 0.14);
      padding-bottom: 9px;
    }

    .detail-label {
      color: rgba(29, 53, 87, 0.7);
      font-weight: 600;
    }

    .detail-value {
      font-weight: 800;
      color: var(--primary);
    }

    .detail-value.order-id {
      letter-spacing: 0.5px;
    }

    .detail-value.delivery-status {
      color: var(--primary);
      font-weight: 900;
    }

    .thankyou-note {
      font-size: 13.5px;
      font-weight: 600;
      color: rgba(29, 53, 87, 0.75);
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .thankyou-action-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 17.5px;
      font-family: inherit;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 16px rgba(29, 53, 87, 0.25);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .thankyou-action-btn:hover {
      background: #152741;
      transform: translateY(-2px);
      color: #FFFFFF;
    }
  </style>
</head>

<body>

  <div class="thankyou-modal-card">
    <!-- Close Button -->
    <a href="index.html" class="thankyou-close-btn" aria-label="Close">&times;</a>

    <!-- Success Icon Circle -->
    <div class="thankyou-icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <!-- Badge -->
    <div class="thankyou-badge">Order Confirmed!</div>

    <!-- Main Headline -->
    <h3 class="thankyou-title">बधाई हो, <span class="customer-name" id="modalCustomerName">Anita Yadav</span>!</h3>

    <!-- Subtitle -->
    <p class="thankyou-desc">
      आपके लिए <strong>Neuro Mantra</strong> का ऑर्डर सफलतापूर्वक स्वीकार कर लिया गया है।
    </p>

    <!-- Details Box -->
    <div class="thankyou-details-box">
      <div class="thankyou-detail-row">
        <span class="detail-label">Order ID:</span>
        <span class="detail-value order-id" id="modalOrderId">NM-702926</span>
      </div>
      <div class="thankyou-detail-row">
        <span class="detail-label">Mobile:</span>
        <span class="detail-value" id="modalCustomerPhone">+91 9001050074</span>
      </div>
      <div class="thankyou-detail-row">
        <span class="detail-label">Delivery:</span>
        <span class="detail-value delivery-status">FREE Express Delivery</span>
      </div>
    </div>

    <!-- Note -->
    <p class="thankyou-note">
      हमारे विशेषज्ञ जल्द ही डिलीवरी कन्फर्मेशन के लिए आपसे संपर्क करेंगे।
    </p>

    <!-- Action Button -->
    <a href="index.html" class="thankyou-action-btn" id="modalActionBtn">
      धन्यवाद, ठीक है
    </a>
  </div>

  <!-- Dynamic Param Reader Script -->
  <script>
    (function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        const phone = params.get('phone');
        const orderId = params.get('orderId');

        if (name && name.trim()) {
          document.getElementById('modalCustomerName').textContent = name.trim();
        }

        if (phone && phone.trim()) {
          const cleanPhone = phone.trim().replace(/^\+91/, '').trim();
          document.getElementById('modalCustomerPhone').textContent = '+91 ' + cleanPhone;
        }

        if (orderId && orderId.trim()) {
          document.getElementById('modalOrderId').textContent = orderId.trim();
        } else {
          // Default fallback Order ID if opened without query params
          const randomNum = Math.floor(100000 + Math.random() * 900000);
          document.getElementById('modalOrderId').textContent = 'NM-' + randomNum;
        }
      } catch (err) {
        console.error('Error parsing order query params:', err);
      }
    })();
  </script>

</body>

</html>
